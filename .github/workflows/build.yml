name: Feditext simulator build
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        default: app-store-testflight
        required: true
      repo:
        description: Repository to clone (owner/name); default is this repo once branches are mirrored here, or feditext/feditext
        default: ""
        required: false
      xcode:
        description: Xcode app name under /Applications (blank = newest Xcode 16)
        default: ""
        required: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 80
    permissions:
      contents: write
    env:
      BRANCH: ${{ inputs.branch || 'app-store-testflight' }}
      SRC_REPO: ${{ inputs.repo || github.repository }}
      XCODE_APP: ${{ inputs.xcode }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
      - name: Clone Feditext (GPL-3, github.com/feditext/feditext)
        run: |
          git clone --depth 1 -b "$BRANCH" "https://github.com/$SRC_REPO.git" src
          echo "$SRC_REPO $BRANCH $(cd src && git rev-parse HEAD)" > feditext-commit.txt
          cat feditext-commit.txt
      - name: Pick Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ -z "$XCODE_APP" ]; then XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1); fi
          if [ -n "$XCODE_APP" ] && [ -d "$XCODE_APP" ]; then sudo xcode-select -s "$XCODE_APP"; fi
          xcodebuild -version | tee xcode-info.txt
          xcrun simctl list runtimes | tee -a xcode-info.txt
          (cd src && xcodebuild -list -project Feditext.xcodeproj) | tee -a xcode-info.txt
      - name: Resolve packages
        working-directory: src
        run: xcodebuild -resolvePackageDependencies -project Feditext.xcodeproj -scheme Feditext -derivedDataPath build 2>&1 | tee ../resolve.log | tail -30
      - name: Build for iOS Simulator (Debug, ad-hoc signed so the app group and keychain entitlements exist)
        working-directory: src
        run: |
          set -o pipefail
          # The app keeps its database in the app-group container; without entitlements that container is nil and the app quits at launch.
          # Simulator builds need no Apple account: "-" is the local ad-hoc identity.
          if ! xcodebuild -project Feditext.xcodeproj -scheme Feditext -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -skipPackagePluginValidation -skipMacroValidation \
            build 2>&1 | tee ../build.log | (grep -E "error:|BUILD|Linking" || true) | tail -60; then
            echo "ad-hoc build failed; building unsigned and signing by hand" | tee -a ../build.log
            xcodebuild -project Feditext.xcodeproj -scheme Feditext -configuration Debug \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
              -skipPackagePluginValidation -skipMacroValidation \
              build 2>&1 | tee -a ../build.log | (grep -E "error:|BUILD" || true) | tail -40
            BASE=$(grep FEDITEXT_BUNDLE_ID_BASE Identity.xcconfig | sed 's/.*= *//')
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups array" -c "Add :com.apple.security.application-groups:0 string group.$BASE" -c "Add :keychain-access-groups array" -c "Add :keychain-access-groups:0 string $BASE" ent.plist
            APP=build/Build/Products/Debug-iphonesimulator/Feditext.app
            for x in "$APP"/PlugIns/*.appex "$APP"/Frameworks/*; do [ -e "$x" ] && codesign --force --sign - --entitlements ent.plist "$x"; done
            codesign --force --sign - --entitlements ent.plist "$APP"
          fi
      - name: Check entitlements and launch it in a simulator here
        working-directory: src
        run: |
          set +e
          APP=build/Build/Products/Debug-iphonesimulator/Feditext.app
          { echo "== codesign"; codesign -d --entitlements - --xml "$APP" 2>&1 | plutil -p - 2>&1 | head -40
            echo "== __entitlements section"; otool -X -s __TEXT __entitlements "$APP/Feditext" 2>&1 | head -5; } | tee ../launch.txt
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "device $DEV" | tee -a ../launch.txt
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b > /dev/null
          xcrun simctl install "$DEV" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl launch "$DEV" "$BID" 2>&1 | tee -a ../launch.txt
          sleep 20
          xcrun simctl io "$DEV" screenshot ../launch.png
          echo "== running after 20 s:" | tee -a ../launch.txt
          xcrun simctl spawn "$DEV" launchctl list 2>/dev/null | grep -i "$BID" | tee -a ../launch.txt
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i feditext | tee -a ../launch.txt
          for f in ~/Library/Logs/DiagnosticReports/*Feditext*; do [ -f "$f" ] && head -c 3000 "$f" >> ../launch.txt; done
          true
      - name: Zip the app
        run: |
          ls -la src/build/Build/Products/Debug-iphonesimulator/
          cd src/build/Build/Products/Debug-iphonesimulator && zip -qr -y "$GITHUB_WORKSPACE/Feditext.app.zip" Feditext.app
          ls -la "$GITHUB_WORKSPACE/Feditext.app.zip"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Feditext-sim-${{ github.run_number }}
          path: |
            Feditext.app.zip
            build.log
            resolve.log
            xcode-info.txt
            feditext-commit.txt
            launch.txt
            launch.png
          if-no-files-found: warn
      - name: Record logs and links in the repo
        if: always()
        run: |
          set +e
          N=${GITHUB_RUN_NUMBER}
          mkdir -p ci-out
          cp feditext-commit.txt ci-out/feditext-commit-$N.txt 2>/dev/null
          head -c 7000 launch.txt > ci-out/launch-$N.txt 2>/dev/null; cp launch.png ci-out/launch-$N.png 2>/dev/null
          head -c 7000 xcode-info.txt > ci-out/xcode-info-$N.txt 2>/dev/null
          { grep -E "error:|error |fatal|Could not|failed" build.log resolve.log 2>/dev/null | grep -v "warning:" | head -60 | cut -c1-400; echo "--- tail build.log ---"; tail -25 build.log 2>/dev/null | cut -c1-300; } | head -c 7000 > ci-out/errors-$N.txt
          {
            echo "run=$N"
            if [ -f Feditext.app.zip ]; then
              echo "size=$(stat -f%z Feditext.app.zip)"
              echo "sha256=$(shasum -a 256 Feditext.app.zip | cut -d' ' -f1)"
              echo -n "litterbox="; curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@Feditext.app.zip" https://litterbox.catbox.moe/resources/internals/api.php; echo
              echo -n "bashupload="; curl -s -A "feditext-sim-ci/1.0" -T Feditext.app.zip https://bashupload.com/Feditext.app.zip | tr -d '\n'; echo
            fi
            if [ -f build.log ]; then
              gzip -kf build.log
              echo -n "log_litterbox="; curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@build.log.gz" https://litterbox.catbox.moe/resources/internals/api.php; echo
            fi
          } > ci-out/links-$N.txt
          cat ci-out/links-$N.txt
          git config user.name "feditext-sim-ci"
          git config user.email "ci@users.noreply.github.com"
          git pull --rebase -q || true
          git add ci-out && git commit -q -m "ci: output of run $N" && git push
